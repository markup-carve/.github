<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="markup-carve">
  <title>markup-carve</title>
  <defs>
    <linearGradient id="carve-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ba38a"/>
      <stop offset="100%" stop-color="#2d6856"/>
    </linearGradient>
    <filter id="carve-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="5"/>
      <feOffset dx="0" dy="5" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" ry="96" fill="url(#carve-bg)"/>

  <g filter="url(#carve-shadow)">
    <path d="M 353 123 L 159 389" stroke="#ffffff" stroke-width="56" stroke-linecap="round"/>
  </g>

  <path d="M 343 138 L 164 384" stroke="#ffffff" stroke-width="15" stroke-linecap="round" opacity="0.35"/>
</svg>
